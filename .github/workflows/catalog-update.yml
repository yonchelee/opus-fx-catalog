# 카탈로그 갱신 — 등록 출처 동기화 · GitHub 신규 후보 발굴 · 별 수 기록 → 생성·검증 → 커밋 → Pages 빌드 → 공개 확인
# 매일: daily (06:17 KST) · 매주 월 05:47 KST: weekly(넓은 생성일 구간) · 수동: Actions 화면의 Run workflow
# 사람 판단이 필요한 '새 프롬프트 모음' 발굴은 클라우드 Routine(월 08:47 KST)이 맡는다 — 이 작업과 겹치지 않는다.
name: catalog-update

on:
  schedule:
    - cron: '17 21 * * *'    # 매일 21:17 UTC = 06:17 KST
    - cron: '47 20 * * 0'    # 일 20:47 UTC = 월 05:47 KST (weekly)
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily 또는 weekly'
        type: choice
        options: [daily, weekly]
        default: daily

permissions:
  contents: write
  pages: write

concurrency:            # 중복 실행 방지: 한 번에 하나, 뒤에 온 실행은 기다린다
  group: catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPUS_FX_HOME: /tmp/opus-fx
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 최신 main 으로 (줄을 선 실행은 대기 시작 시점의 커밋을 받으므로, 앞 실행이 올린 결과 위에서 시작한다)
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git log --oneline -1

      - name: 실행 모드
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ inputs.mode }}";
          elif [ "${{ github.event.schedule }}" = "47 20 * * 0" ]; then m=weekly; else m=daily; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"; echo "mode=$m"

      - name: 파이프라인 (동기화 → 발굴 → 생성 → 검증)
        id: pipe
        run: |
          set +e
          python3 skill/opus-fx-scout/scripts/pipeline.py --dir . --mode "${{ steps.mode.outputs.mode }}"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 시험
        id: tests
        if: steps.pipe.outputs.code == '0'
        continue-on-error: true
        run: |
          python3 -m unittest discover -s tests
          node --test

      - name: 실패하면 불완전한 결과를 버리고 실패 기록만 남김
        if: steps.pipe.outputs.code != '0' || steps.tests.outcome != 'success'
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('status.json'); s = json.loads(p.read_text())
          s.setdefault('stages', {}).setdefault('publish', {})
          s['stages']['publish'].pop('missed_run', None)
          s['stages']['publish'].update(ok=False, last_attempt=s['updated'],
              message='수집·생성·검증·시험 중 실패 — 이번 결과는 배포하지 않음 (pipeline=${{ steps.pipe.outputs.code }}, tests=${{ steps.tests.outcome }})')
          p.write_text(json.dumps(s, ensure_ascii=False, indent=1) + '\n')
          PY
          cp status.json "$RUNNER_TEMP/status.json"; cp -r discovery/runs "$RUNNER_TEMP/runs"
          git checkout -- . && git clean -fdq
          cp "$RUNNER_TEMP/status.json" status.json; cp -r "$RUNNER_TEMP/runs/." discovery/runs/
          echo "FAILED=1" >> "$GITHUB_ENV"

      - name: 커밋·push (충돌 시 최신 main 위로 다시)
        id: commit
        run: |
          git config user.name "opus-fx-catalog bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg="catalog: ${{ steps.mode.outputs.mode }} 갱신 (run ${{ github.run_id }})"
          [ -n "${FAILED:-}" ] && msg="status: 갱신 실패 기록 (run ${{ github.run_id }})"
          bash skill/opus-fx-scout/scripts/ci/commit_push.sh "$msg"

      - name: Pages 빌드 요청과 공개 확인
        if: steps.commit.outputs.pushed == 'true'
        run: bash skill/opus-fx-scout/scripts/ci/pages_publish.sh "${{ github.repository }}" "${{ github.run_id }}"

      - name: 실패로 끝내기
        if: env.FAILED == '1'
        run: |
          echo "이번 회차는 수집·검증 실패로 배포하지 않았다. discovery/runs 의 기록을 보라."
          exit 1
